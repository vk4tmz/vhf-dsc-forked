name: DSC decoder offline validation
on:
  push:
    branches: [perf/dot-pattern-optimisation, experiment/clock-recovery-transition, experiment/frequency-offset-once, experiment/clock-longburst-tracking, experiment/clock-recovery-fast-correlators]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install decoder dependencies
        run: python -m pip install -r requirements.txt
      - name: Exhaustive codeword regression
        run: python -m unittest discover -s tests -v
      - name: DSC fixture regression
        run: python test_samples.py
      - name: Original versus fork (all six fixtures)
        run: python scripts/benchmark_dot_pattern.py --all
      - name: Incremental demodulation optimisation comparison
        run: python scripts/benchmark_dot_pattern.py --baseline-ref 5a92c5b --all
      - name: Diagnose clock recovery enabled versus disabled
        if: github.ref_name != 'perf/dot-pattern-optimisation'
        run: |
          python scripts/diagnose_clock_recovery.py --wav samples/individual_call.wav
          python scripts/diagnose_clock_recovery.py --wav samples/noise.wav
      - name: Probe timing drift with synthetic AFSK
        if: github.ref_name != 'perf/dot-pattern-optimisation'
        run: python scripts/probe_clock_recovery_fsk.py
      - name: Probe long-burst clock tracking over 3600 bits
        if: (github.ref_name == 'experiment/clock-longburst-tracking' || github.ref_name == 'experiment/clock-recovery-fast-correlators')
        run: python scripts/probe_clock_recovery_fsk.py --bits 3600
      - name: Probe 3-second noisy DSC windows and processing cost
        if: (github.ref_name == 'experiment/clock-longburst-tracking' || github.ref_name == 'experiment/clock-recovery-fast-correlators')
        run: python scripts/probe_three_second_windows.py
      - name: Compare fast correlators with longburst baseline
        if: github.ref_name == 'experiment/clock-recovery-fast-correlators'
        run: python scripts/benchmark_dot_pattern.py --baseline-ref 0666988 --all
      - name: Probe full DSC frames with time-base drift and noise
        if: github.ref_name != 'perf/dot-pattern-optimisation'
        run: python scripts/probe_clock_recovery_dsc.py --all
      - name: Diagnose dot-sync ranking in shifted all-ships frames
        if: github.ref_name != 'perf/dot-pattern-optimisation'
        run: python scripts/diagnose_candidate_ranking.py
      - name: Diagnose dot synchronizer versus timing fallback
        if: (github.ref_name == 'experiment/clock-longburst-tracking' || github.ref_name == 'experiment/clock-recovery-fast-correlators') || (github.ref_name == 'experiment/frequency-offset-once' || github.ref_name == 'experiment/clock-recovery-fast-correlators')
        run: python scripts/diagnose_dot_sync_fallback.py
